language: 'ko-KR'

early_access: false

reviews:
  profile: 'assertive'

  high_level_summary: true
  request_changes_workflow: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'develop'

  path_instructions:
    # ==================================================
    # 전체 TypeScript / React Native 코드
    # 2026 ONE FRONTEND CODING CONVENTION
    # ==================================================

    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        이 프로젝트의 TypeScript / React Native 코드는 
        2026 ONE FRONTEND CODING CONVENTION을 기본 리뷰 기준으로 사용한다. 

        [공통 원칙] 

        - "내가 처음 보는 사람이라고 생각하고 짠다"를 기본 원칙으로 한다. 
        - 가독성과 유지보수성을 우선한다. 
        - 기존 프로젝트의 일관된 구현을 우선한다. 
        - 단순한 개인 취향이나 스타일 차이는 과도하게 지적하지 않는다. 
        - 실제 버그, 타입 안정성, 사용자 경험에 영향을 주는 문제를 우선적으로 지적한다. 
        - 프로젝트에 정의되지 않은 새로운 패턴이나 라이브러리를 임의로 강제하지 않는다. 
        - 변경 범위와 관계없는 기존 코드를 불필요하게 수정하도록 요구하지 않는다. 

        [프로젝트 구조] 

        src/ 
        - components/: 재사용 컴포넌트 
        - components/ui/: 기본 UI 컴포넌트 
        - components/layout/: 공통 레이아웃 
        - screens/: 화면 단위 컴포넌트 
        - navigation/: React Navigation 설정 
        - store/: Zustand 스토어 
        - hooks/: 커스텀 훅 
        - services/: API 호출 함수 
        - types/: 전역 TypeScript 타입 
        - utils/: 순수 유틸 함수 
        - constants/: 상수 
        - assets/: 이미지 및 폰트 

        - 화면에 직접 사용되는 로직과 재사용 가능한 로직을 적절한 위치로 분리한다. 
        - screens에는 Navigation 라우트와 1:1로 매칭되는 화면을 둔다. 
        - 화면 내부의 재사용 가능한 컴포넌트는 적절한 components 폴더로 분리한다. 
        - 복잡한 화면은 screens/{ScreenName}/ 구조로 분리한다. 
        - 한 폴더에 파일이 10개 이상 쌓이면 하위 폴더 분리를 검토한다. 
        - 각 폴더의 index.ts를 통한 barrel export를 프로젝트 기존 방식에 맞게 사용한다. 

        [네이밍] 

        파일: 
        - 컴포넌트: PascalCase.tsx 
        - 스크린: PascalCaseScreen.tsx 
        - Hook: use 접두사의 camelCase 
        - Store: camelCase + Store 
        - Service: camelCase.service.ts 
        - Utility: camelCase.ts 
        - Type: camelCase.types.ts 
        - 폴더: camelCase 

        변수: 
        - camelCase 

        함수: 
        - camelCase 

        컴포넌트: 
        - PascalCase 

        타입 / 인터페이스: 
        - PascalCase 

        상수: 
        - UPPER_SNAKE_CASE 

        Boolean: 
        - is / has / can / should 접두사 

        이벤트 핸들러: 
        - handle 접두사 

        props로 전달되는 핸들러: 
        - on 접두사 

        의미 없는 약어를 사용하지 않는다. 
        예: 
        - btn -> button 
        - usr -> user 
        - tmp -> temporary 

        한글 변수명을 사용하지 않는다. 

        data, info, value처럼 의미가 모호한 이름을 단독으로 사용하지 않는다. 
        필요한 경우 userData, boothInfo 등 맥락을 포함한다. 

        [TypeScript] 

        - any 사용을 지양한다. 
        - 명시적인 타입을 사용한다. 
        - any 대신 구체적인 타입 또는 필요한 경우 unknown을 사용한다. 
        - 함수 파라미터와 반환 타입을 명시한다. 
        - type보다 interface를 우선 사용한다. 
        - Optional chaining(?.)을 적극 활용한다. 
        - Nullish coalescing(??)을 적극 활용한다. 
        - Props 타입을 명확하게 정의한다. 
        - API 응답 타입을 명확하게 정의한다. 

        [컴포넌트] 

        - 함수형 컴포넌트와 화살표 함수만 사용한다. 
        - Class 컴포넌트를 사용하지 않는다. 
        - 하나의 파일에는 하나의 컴포넌트를 둔다. 
        - 파일당 default export는 하나를 사용한다. 
        - 컴포넌트가 100줄을 초과하면 분리를 검토한다. 
        - props가 5개를 초과하면 객체로 묶거나 컴포넌트 구조를 재검토한다. 
        - 리스트 아이템은 별도 컴포넌트로 분리한다. 
        - Navigation 라우트와 직접 매칭되는 화면은 screens에 둔다. 

        컴포넌트 내부 코드 순서는 다음을 우선한다. 

        1. Hooks 
        2. 파생 값 
        3. Early return 
        4. Rendering 

        조건부 렌더링: 
        - 삼항 연산자는 1단까지만 사용한다. 
        - 중첩 삼항 연산자를 사용하지 않는다. 
        - 복잡한 조건은 변수로 분리하거나 early return을 사용한다. 

        [React 최적화] 

        React.memo: 
        - 부모 리렌더링으로 불필요한 자식 렌더링이 발생하는 경우 사용한다. 

        useCallback: 
        - 자식 컴포넌트에 콜백 prop으로 전달되는 함수에 사용한다. 

        useMemo: 
        - 정렬, 필터 등 계산 비용이 높은 파생 값에 사용한다. 

        단순한 함수에 성능 최적화를 목적으로 무조건 useCallback이나 useMemo를 사용하지 않는다. 

        [NativeWind / Tailwind] 

        - 인라인 StyleSheet 사용을 지양한다. 
        - className을 사용한다. 
        - style과 className을 불필요하게 혼용하지 않는다. 
        - 동적 스타일은 조건 변수로 분리하여 가독성을 높인다. 
        - 자주 사용하는 스타일 조합은 컴포넌트로 추상화한다. 
        - Tailwind 클래스 순서는 프로젝트 Prettier 설정을 따른다. 

        클래스 순서는 다음을 우선한다. 

        1. 레이아웃 
        2. 위치 
        3. 크기 
        4. 간격 
        5. 배경 및 테두리 
        6. 텍스트 
        7. 효과 및 기타 

        색상과 폰트를 임의의 하드코딩 값으로 사용하지 않는다. 
        프로젝트의 디자인 토큰과 tailwind.config.js에 정의된 값을 우선한다. 

        [폰트] 

        프로젝트 기본 폰트는 Noto Sans KR이다. 

        다음 클래스를 사용한다. 

        - font-notoSansKRBold 
        - font-notoSansKRRegular 
        - font-notoSansKRDemiLight 

        다음 기본 Tailwind 폰트 클래스는 사용하지 않는다. 

        - font-bold 
        - font-semibold 
        - font-medium 
        - font-regular 
        - font-Regular 
        - font-light 
        - font-thin 

        [Zustand] 

        - Store는 도메인 단위로 분리한다. 
        - authStore, boothStore, uiStore 등 도메인별 Store 구조를 우선한다. 
        - UI 상태는 필요한 경우 uiStore로 분리한다. 
        - 컴포넌트에서는 필요한 상태와 액션만 selector로 구독한다. 
        - 전체 Store를 구독하여 불필요한 리렌더링이 발생하지 않는지 확인한다. 
        - 서버 데이터 캐싱이 필요한 경우 React Query 사용을 고려한다. 

        [Navigation] 

        - Navigation 설정은 navigation/ 폴더에서 관리한다. 
        - Navigation Param은 타입을 정의하여 타입 안전성을 확보한다. 
        - screen 컴포넌트를 Navigator 파일 내부에서 직접 작성하지 않는다. 
        - Navigator에서는 screen 컴포넌트를 import하여 사용한다. 
        - 중첩 Navigator는 최대 2단계까지 사용한다. 
        - navigation.navigate 호출 시 정의된 Param 타입과 일치하는지 확인한다. 

        [API] 

        - 모든 API 요청은 services/ 폴더의 함수를 통해 호출한다. 
        - 컴포넌트에서 axios.get(), axios.post() 등을 직접 호출하지 않는다. 
        - 공통 Axios instance를 사용한다. 
        - API Base URL과 timeout 등 공통 설정은 instance에서 관리한다. 
        - API 응답 타입을 명확하게 지정한다. 
        - API 함수와 UI 컴포넌트의 책임을 분리한다. 

        [에러 처리] 

        - 비동기 호출에서 발생 가능한 에러를 적절하게 처리한다. 
        - 사용자에게 표시되는 에러 메시지는 프로젝트의 상수 관리 방식을 따른다. 
        - console 로그가 필요한 경우 프로젝트의 기존 로그 형식과 일관성을 유지한다. 
        - 에러를 무시하는 빈 catch를 작성하지 않는다. 
        - API 에러와 UI 에러를 적절하게 구분한다. 

        [Import / Export] 

        Import 순서는 다음을 우선한다. 

        1. React 및 React Native 
        2. 외부 라이브러리 
        3. 프로젝트 내부 모듈 

        각 그룹 사이에는 빈 줄을 둔다. 

        프로젝트의 barrel export 방식이 적용된 경우 index.ts를 통한 import를 우선한다. 

        [리뷰 우선순위] 

        다음 순서로 문제를 판단한다. 

        1. 실제 버그 
        2. 타입 안정성 문제 
        3. 런타임 에러 가능성 
        4. API 통신 문제 
        5. 상태 관리 문제 
        6. Navigation 문제 
        7. 사용자 경험에 영향을 주는 문제 
        8. 성능 문제 
        9. 프로젝트 Coding Convention 위반 
        10. 단순 스타일 문제 

        단순한 개인 취향이나 스타일 차이는 request changes의 근거로 사용하지 않는다. 

        기존 프로젝트 코드와 일관된 구현이라면 단순히 다른 구현 방식이라는 이유로 
        변경을 요구하지 않는다.

    # ==================================================
    # Components
    # ==================================================

    - path: 'src/components/**/*.{ts,tsx}'
      instructions: |
        Component 추가 리뷰 기준: 

        - 재사용 가능한 UI 컴포넌트인지 확인한다. 
        - 하나의 컴포넌트가 지나치게 많은 책임을 가지지 않는지 확인한다. 
        - 컴포넌트는 함수형 컴포넌트 + 화살표 함수를 사용한다. 
        - 파일당 하나의 컴포넌트를 사용한다. 
        - 100줄을 초과하는 경우 컴포넌트 분리를 검토한다. 
        - props가 5개를 초과하는 경우 구조를 재검토한다. 
        - 리스트 아이템은 별도 컴포넌트로 분리한다. 
        - Boolean props는 is/has/can/should 등의 명확한 이름을 사용한다. 
        - 이벤트 핸들러는 handle 접두사를 사용한다. 
        - props로 전달되는 핸들러는 on 접두사를 사용한다.

    # ==================================================
    # Screens
    # ==================================================

    - path: 'src/screens/**/*.{ts,tsx}'
      instructions: |
        Screen 추가 리뷰 기준: 

        - Navigation 라우트와 1:1로 매칭되는 화면인지 확인한다. 
        - 화면에서 과도한 비즈니스 로직을 처리하지 않는지 확인한다. 
        - 재사용 가능한 UI는 components로 분리한다. 
        - 재사용 가능한 상태 로직은 hooks 또는 store로 분리한다. 
        - API 요청을 직접 axios로 호출하지 않고 services를 사용하는지 확인한다. 
        - 복잡한 화면은 screens/{ScreenName}/components/ 구조로 분리한다. 
        - 조건부 렌더링이 지나치게 복잡하지 않은지 확인한다. 
        - loading / error / empty 상태가 필요한 화면에서 적절하게 처리되는지 확인한다.

    # ==================================================
    # Hooks
    # ==================================================

    - path: 'src/hooks/**/*.{ts,tsx}'
      instructions: |
        Hook 추가 리뷰 기준: 

        - Hook 파일은 use 접두사를 사용한다. 
        - 하나의 Hook이 지나치게 많은 책임을 가지지 않는지 확인한다. 
        - Hook 내부에서 사용하는 상태와 effect의 의존성이 올바른지 확인한다. 
        - useEffect의 dependency array가 실제 사용 값과 일치하는지 확인한다. 
        - 불필요한 useEffect 사용을 지적한다. 
        - 컴포넌트에서 반복되는 로직을 적절하게 Hook으로 분리했는지 확인한다.

    # ==================================================
    # Store
    # ==================================================

    - path: 'src/store/**/*.{ts,tsx}'
      instructions: |
        Zustand Store 추가 리뷰 기준: 

        - Store는 도메인 단위로 분리한다. 
        - UI 상태와 도메인 상태를 필요에 따라 분리한다. 
        - 컴포넌트에서 필요한 값만 selector로 구독하도록 한다. 
        - 전체 Store를 불필요하게 구독하지 않는지 확인한다. 
        - Store가 UI 컴포넌트의 렌더링 로직까지 담당하지 않는지 확인한다. 
        - 서버 데이터 관리가 필요한 경우 적절한 캐싱 전략을 고려한다.

    # ==================================================
    # Services
    # ==================================================

    - path: 'src/services/**/*.{ts,tsx}'
      instructions: |
        API Service 추가 리뷰 기준: 

        - API 호출은 services에서 담당한다. 
        - 컴포넌트에서 직접 axios 요청을 하지 않는다. 
        - 공통 Axios instance를 사용한다. 
        - API 함수의 Request / Response 타입을 명확하게 정의한다. 
        - API URL을 컴포넌트에 하드코딩하지 않는다. 
        - API 에러가 호출자에게 적절하게 전달되는지 확인한다. 
        - 동일한 API 설정이나 로직이 중복되지 않는지 확인한다.

    # ==================================================
    # Types
    # ==================================================

    - path: 'src/types/**/*.{ts,tsx}'
      instructions: |
        Type 추가 리뷰 기준: 

        - 타입과 인터페이스의 역할을 명확하게 한다. 
        - 프로젝트 컨벤션에 따라 interface를 우선한다. 
        - any 사용을 지양한다. 
        - API Request / Response 타입을 명확하게 정의한다. 
        - 동일한 타입을 여러 곳에서 중복 선언하지 않는다. 
        - 타입 이름은 PascalCase를 사용한다. 
        - 의미가 불명확한 타입명을 사용하지 않는다.

    # ==================================================
    # Navigation
    # ==================================================

    - path: 'src/navigation/**/*.{ts,tsx}'
      instructions: |
        Navigation 추가 리뷰 기준: 

        - Navigator는 navigation/ 폴더에서 관리한다. 
        - Navigation Param 타입을 명확하게 정의한다. 
        - navigation.navigate 호출 시 Param 타입이 일치하는지 확인한다. 
        - Navigator 내부에 실제 Screen UI를 직접 작성하지 않는다. 
        - Screen을 import하여 Navigator에 연결한다. 
        - 중첩 Navigator는 최대 2단계까지 사용한다.

    # ==================================================
    # Utils
    # ==================================================

    - path: 'src/utils/**/*.{ts,tsx}'
      instructions: |
        Utility 추가 리뷰 기준: 

        - 순수 함수 형태를 우선한다. 
        - 특정 Screen이나 Component에 종속된 로직은 utils에 넣지 않는다. 
        - 동일한 유틸 함수가 중복 구현되지 않는지 확인한다. 
        - 함수 이름은 실제 동작을 명확하게 표현한다. 
        - 입력과 반환 타입을 명확하게 정의한다.

    # ==================================================
    # Constants
    # ==================================================

    - path: 'src/constants/**/*.{ts,tsx}'
      instructions: |
        Constants 추가 리뷰 기준: 

        - 여러 곳에서 사용하는 상수는 constants에서 관리한다. 
        - 모듈 레벨 상수는 UPPER_SNAKE_CASE를 사용한다. 
        - 색상, 폰트 등 디자인 토큰은 tailwind.config.js 등 프로젝트의 
          기존 디자인 시스템을 우선한다. 
        - 동일한 값을 여러 파일에서 하드코딩하지 않는다.

    # ==================================================
    # Assets / Fonts
    # ==================================================

    - path: 'src/assets/**/*'
      instructions: |
        Asset 추가 리뷰 기준: 

        - 프로젝트에서 사용하는 기존 Asset 구조를 따른다. 
        - 폰트는 프로젝트에서 정의한 Noto Sans KR 폰트를 사용한다. 
        - 임의의 기본 Tailwind 폰트 클래스를 사용하지 않는다.

    # ==================================================
    # 금지 사항 / Anti-patterns
    # ==================================================

    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        다음 패턴은 실제 문제 가능성이 있는 경우 적극적으로 지적한다. 

        - any의 무분별한 사용 
        - Class Component 사용 
        - 컴포넌트에서 직접 axios 호출 
        - 전체 Zustand Store 구독 
        - 중첩 삼항 연산자 
        - 과도하게 긴 Component 
        - 과도하게 많은 props 
        - 의미 없는 변수명 
        - 의미 없는 약어 
        - 한글 변수명 
        - StyleSheet와 className의 불필요한 혼용 
        - 금지된 기본 Tailwind font 클래스 사용 
        - API 응답 타입이 없는 경우 
        - Navigation Param 타입 불일치 
        - 에러를 무시하는 빈 catch 
        - 동일 로직의 불필요한 중복 

        단, 기존 프로젝트 코드와의 호환성이나 기술적 이유가 명확한 경우 
        단순히 해당 패턴이 존재한다는 이유만으로 request changes를 요구하지 않는다.
